<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stack website</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">

    <!-- HEADER -->
    <div class="header">
      <h1>UAS Struktur Data</h1>
        <p>Kelompok 2 (stack)</p>
    </div>

    <div class="main-layout">

      <!-- PANEL KIRI: Visualisasi Stack -->
      <div class="panel">
        <div class="panel-title">Visualisasi Stack</div>
        <div class="stack-container" id="stackVis">
          <div class="empty-label" id="emptyMsg">stack kosong</div>
        </div>

        <div class="stack-base"></div>

        <div class="stats-row">
          <div class="stat-card">
            <div class="stat-val" id="sizeVal">0</div>
            <div class="stat-label">ukuran</div>
          </div>
          <div class="stat-card">
            <div class="stat-val" id="opsVal">0</div>
            <div class="stat-label">banyaknya operasi</div>
          </div>
        </div>
      </div>

      <!-- PANEL KANAN: Kontrol Operasi -->
      <div class="panel">
        <div class="panel-title">Operasi Stack</div>

        <div class="controls">
          <!-- Input + Push -->
          <div class="input-row">
            <input type="text" id="inputVal" placeholder="masukkan nilai..." maxlength="12" />
            <button class="btn btn-push" onclick="doPush()">Push</button>
          </div>

          <!-- Pop -->
          <button class="btn btn-pop" onclick="doPop()">
            Pop (ambil dan hapus top)
          </button>

          <!-- Peek -->
          <button class="btn btn-peek" onclick="doPeek()">
            Peek (lihat top)
          </button>

          <!-- Clear -->
          <button class="btn btn-clear" onclick="doClear()">
            Clear (kosongkan stack)
          </button>

          <!-- Output info -->
          <div class="panel-title" style="margin-top: 0.5rem;">Output</div>
          <div class="info-box" id="infoBox"></div>

          <!-- Log operasi -->
          <div class="panel-title">History Operasi</div>
          <div class="log-panel" id="logPanel">
            <div class="log-item">
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript dimuat di akhir body -->
  <script src="script.js"></script>

</body>
</html>
